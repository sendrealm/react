name: Publish React Web Push SDK

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: react-web-push-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "react-sdk-v${package_version}"
      - name: Run release checks
        run: pnpm run release:check
      - name: Publish public package
        run: npm publish
