name: React Web Push SDK CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: react-web-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: Validate release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run release checks
        run: pnpm run release:check
      - name: Pack SDK
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Verify required package files
        run: |
          tarball="$(find "$RUNNER_TEMP" -name 'sendrealm-react-*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tf "$tarball" | grep -qx 'package/LICENSE'
          tar -tf "$tarball" | grep -qx 'package/dist/index.mjs'
          tar -tf "$tarball" | grep -qx 'package/dist/index.cjs'
          tar -tf "$tarball" | grep -qx 'package/sendrealm-service-worker.js'
